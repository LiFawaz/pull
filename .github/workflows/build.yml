name: Build Pull plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: bun install

      - name: Build Pull
        run: bun --bun run build --plugins-dir plugins pull

      - name: Package installable ZIP
        run: python scripts/package_plugin.py pull

      - name: Verify installable ZIP
        run: python scripts/check_zip.py pull

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pull-1.0.0-install-zip
          path: build/dist/com.lifawaz.pull@1.0.0.zip
          if-no-files-found: error
          retention-days: 30
