name: Build and publish Pull plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.json"
      - "pool/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: bun install

      - name: Build Pull
        run: bun --bun run build --plugins-dir plugins pull

      - name: Package installable ZIP
        run: python scripts/package_plugin.py pull

      - name: Verify installable ZIP
        run: python scripts/check_zip.py pull

      - name: Publish repository index and ZIP
        run: |
          python scripts/publish_index.py pull
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json pool/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Pull 1.0.7 [skip ci]"
            git push
          fi

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pull-1.0.7-install-zip
          path: build/dist/com.lifawaz.pull@1.0.7.zip
          if-no-files-found: error
          retention-days: 30
