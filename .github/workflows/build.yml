name: Build and publish Pull plugin

on:
  push:
    branches: [main, fix/voice-state-map-handling-2026-11-16]
    paths-ignore:
      - "index.json"
      - "pool/**"
  workflow_dispatch:

permissions:
  contents: write

# Keep one publisher per branch; older queued runs must not overwrite newer source.
concurrency:
  group: pull-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read plugin version
        id: plugin
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("plugins/pull/manifest.json", encoding="utf-8"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install

      - name: Test Pull logic
        run: bun run test

      - name: Build Pull
        run: bun --bun run build --plugins-dir plugins pull

      - name: Package installable ZIP
        run: python scripts/package_plugin.py pull

      - name: Verify installable ZIP
        run: python scripts/check_zip.py pull

      - name: Publish repository index and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch may have received an earlier publish commit while this
          # run was building. Refresh only if the actual plugin source is unchanged.
          git fetch origin "${GITHUB_REF}"
          REMOTE_REF="origin/${GITHUB_REF_NAME}"
          if ! git diff --quiet HEAD "$REMOTE_REF" -- plugins/pull; then
            echo "::warning::Pull source changed while this run was building; skipping repository publication. The verified ZIP artifact will still be uploaded."
          else
            git reset --hard "$REMOTE_REF"
            python scripts/publish_index.py pull
            git add index.json pool/
            if ! git diff --cached --quiet; then
              git commit -m "Publish Pull ${{ steps.plugin.outputs.version }} [skip ci]"
              git push origin "HEAD:${GITHUB_REF}"
            fi
          fi

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pull-${{ steps.plugin.outputs.version }}-install-zip
          path: build/dist/com.lifawaz.pull@${{ steps.plugin.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
